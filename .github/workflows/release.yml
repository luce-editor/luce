name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Determine Version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $ver = "${{ github.ref_name }}"
          }
          if (-not $ver -or $ver -eq "main" -or $ver -eq "master") {
            $ver = "v0.1.0"
          }
          $cleanVer = $ver.TrimStart('v')
          "APP_VERSION=$cleanVer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Target Version: $ver (Clean: $cleanVer)"

      - name: Configure CMake
        run: >
          cmake -B build
          -A x64
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Luce (Release)
        run: cmake --build build --config Release --parallel

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          iscc /DMyAppVersion="$env:APP_VERSION" installer\luce_setup.iss
          $installerPath = "build\installer\Luce-Setup-x64.exe"
          $renamedInstaller = "build\installer\Luce-Setup-$env:RELEASE_TAG-x64.exe"
          Move-Item $installerPath $renamedInstaller
          Write-Host "Created: $renamedInstaller"

      - name: Create Portable ZIP Archive
        shell: pwsh
        run: |
          $portableDir = "build\portable\Luce"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "build\Release\luce.exe" $portableDir
          Copy-Item -Recurse "build\Release\assets" $portableDir
          Copy-Item -Recurse "build\Release\themes" $portableDir
          Copy-Item -Recurse "build\Release\plugins" $portableDir
          Copy-Item "LICENSE" $portableDir
          Copy-Item "README.md" $portableDir

          $zipOutput = "build\installer\Luce-$env:RELEASE_TAG-win64-portable.zip"
          Compress-Archive -Path "build\portable\Luce" -DestinationPath $zipOutput -CompressionLevel Optimal
          Write-Host "Created: $zipOutput"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = "build\installer\Luce-Setup-$env:RELEASE_TAG-x64.exe"
          $zip = "build\installer\Luce-$env:RELEASE_TAG-win64-portable.zip"
          gh release create "$env:RELEASE_TAG" $installer $zip `
            --title "Luce $env:RELEASE_TAG" `
            --generate-notes `
            --target "${{ github.sha }}"
