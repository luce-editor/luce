name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
      release_notes:
        description: 'Release description (optional markdown). If left empty, RELEASE_NOTES.md or automatic template is used.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Determine Version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $ver = "${{ github.ref_name }}"
          }
          if (-not $ver -or $ver -eq "main" -or $ver -eq "master") {
            $ver = "v0.1.0"
          }
          $cleanVer = $ver.TrimStart('v')
          "APP_VERSION=$cleanVer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Target Version: $ver (Clean: $cleanVer)"

      - name: Configure CMake
        run: >
          cmake -B build
          -A x64
          -DCMAKE_BUILD_TYPE=Release

      - name: Build Luce (Release)
        run: cmake --build build --config Release --parallel

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          iscc /DMyAppVersion="$env:APP_VERSION" installer\luce_setup.iss
          $installerPath = "build\installer\Luce-Setup-x64.exe"
          $renamedInstaller = "build\installer\Luce-Setup-$env:RELEASE_TAG-x64.exe"
          Move-Item $installerPath $renamedInstaller
          Write-Host "Created: $renamedInstaller"

      - name: Create Portable ZIP Archive
        shell: pwsh
        run: |
          $portableDir = "build\portable\Luce"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "build\Release\luce.exe" $portableDir
          Copy-Item -Recurse "build\Release\assets" $portableDir
          Copy-Item -Recurse "build\Release\themes" $portableDir
          Copy-Item -Recurse "build\Release\plugins" $portableDir
          Copy-Item "LICENSE" $portableDir
          Copy-Item "README.md" $portableDir

          $zipOutput = "build\installer\Luce-$env:RELEASE_TAG-win64-portable.zip"
          Compress-Archive -Path "build\portable\Luce" -DestinationPath $zipOutput -CompressionLevel Optimal
          Write-Host "Created: $zipOutput"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          $installer = "build\installer\Luce-Setup-$env:RELEASE_TAG-x64.exe"
          $zip = "build\installer\Luce-$env:RELEASE_TAG-win64-portable.zip"

          $installerHash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash

          $customNotes = ""
          if ($env:INPUT_RELEASE_NOTES) {
            $customNotes = $env:INPUT_RELEASE_NOTES.Trim()
          }

          $notesContent = ""
          if ($customNotes) {
            $notesContent = $customNotes
          } elseif (Test-Path "RELEASE_NOTES.md") {
            $notesContent = Get-Content -Raw "RELEASE_NOTES.md"
          } else {
            $notesContent = @"
## Luce $env:RELEASE_TAG

Welcome to the **$env:RELEASE_TAG** release of **Luce** — a lightweight, GPU-accelerated desktop code editor built with C++23 and Dear ImGui.

### 📦 Downloads & Verification

| File | Type | SHA-256 Checksum |
| :--- | :--- | :--- |
| **\`Luce-Setup-$env:RELEASE_TAG-x64.exe\`** | Windows Installer | \`$installerHash\` |
| **\`Luce-$env:RELEASE_TAG-win64-portable.zip\`** | Portable Archive (.zip) | \`$zipHash\` |

### 🚀 Getting Started

- **Windows Installer (\`.exe\`)**:
  - Automatically installs per-user (no administrator privileges needed).
  - Adds *"Open with Luce"* to the Windows Explorer context menu.
  - Adds \`luce\` to system \`PATH\` for quick terminal launching (\`luce .\`).
  - Creates Desktop and Start Menu shortcuts.
- **Portable Package (\`.zip\`)**:
  - Extract anywhere and run \`luce.exe\` directly without installation.

### 📖 Documentation & Resources

- 🌐 [Official Documentation & Website](https://luce-editor.github.io/luce/)
- ⌨️ [Keyboard Shortcuts Reference](https://luce-editor.github.io/luce/docs/interface/keyboard-shortcuts)
- 🔌 [Lua Plugin System Architecture](https://luce-editor.github.io/luce/docs/plugins/architecture)
"@
          }

          $notesFile = "build\installer\release_body.md"
          $notesContent | Out-File -FilePath $notesFile -Encoding utf8

          if (gh release view "$env:RELEASE_TAG" 2>$null) {
            Write-Host "Release $env:RELEASE_TAG already exists, updating description and assets..."
            gh release edit "$env:RELEASE_TAG" --title "Luce $env:RELEASE_TAG" --notes-file $notesFile
            gh release upload "$env:RELEASE_TAG" $installer $zip --clobber
          } else {
            gh release create "$env:RELEASE_TAG" $installer $zip `
              --title "Luce $env:RELEASE_TAG" `
              --notes-file $notesFile `
              --generate-notes `
              --target "${{ github.sha }}"
          }
